<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thông Báo Đóng Cửa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #09090b 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: auto 0;
      text-align: center;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 36px 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }

    .icon-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid rgba(239, 68, 68, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      font-size: clamp(22px, 6vw, 26px);
      font-weight: 900;
      margin-bottom: 12px;
      color: #fff;
    }

    p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 13px;
      font-weight: 800;
      padding: 8px 18px;
      border-radius: 999px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
    }

    /* Chân trang 7 sắc cầu vồng */
    .author-footer {
      text-align: center;
      padding-top: 10px;
    }

    .rainbow-author {
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ff2400, #e81d1d, #e8b71d, #1de840, #1ddde8, #2b1de8, #dd00f3, #ff2400);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowFlow 3.5s linear infinite;
      display: inline-block;
    }

    @keyframes rainbowFlow {
      0% { background-position: 0% center; }
      100% { background-position: 250% center; }
    }
  </style>
</head>
<body>

  <div></div>

  <main class="container">
    <div class="card">
      <div class="icon-box">🔒</div>
      <h1>Trang Web Đã Đóng Cửa</h1>
      <p>Hệ thống hiện không còn hoạt động và đã ngừng cung cấp dịch vụ. Cảm ơn các bạn đã đồng hành trong thời gian qua!</p>
      <div class="status-badge">
        <span class="dot"></span>
        <span>Ngừng Hoạt Động</span>
      </div>
    </div>
  </main>

  <footer class="author-footer">
    <span class="rainbow-author">Liên hệ: tele@thanhconggdev</span>
  </footer>

</body>
</html>
